name: Verify real Docling Korean PDF conversion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          pip install reportlab pypdfium2
      - name: Build real service and download models
        run: docker build -t review-docling services/docling
      - name: Run isolated converter
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "DOCLING_SHARED_SECRET=$KEY" >> "$GITHUB_ENV"
          docker run -d --name review-docling -p 127.0.0.1:8080:8080 -e "DOCLING_SHARED_SECRET=$KEY" review-docling
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify text table and Korean scanned PDF
        run: python services/docling/smoke_pdf.py
      - name: Collect package versions and model hashes
        if: success()
        run: |
          docker exec review-docling pip freeze > docling-packages.txt
          docker exec review-docling sh -c 'find /opt/docling/models -type f -exec sha256sum {} \;' > docling-model-hashes.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: docling-real-conversion
          path: |
            docling-smoke.json
            docling-packages.txt
            docling-model-hashes.txt
          retention-days: 30
