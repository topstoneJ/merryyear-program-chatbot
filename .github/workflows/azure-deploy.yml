name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Assemble standalone deployment
        shell: bash
        run: |
          mkdir -p deploy/.next
          cp .next/standalone/server.js deploy/server.js
          cp -R .next/standalone/.next/. deploy/.next/
          mkdir runtime-deps
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml runtime-deps/
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --dir runtime-deps
          cp -R runtime-deps/node_modules deploy/node_modules
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          node -e "require('./deploy/node_modules/next/dist/server/next')"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: merryyear-chatbot-v4
          package: deploy

      - name: Restart Azure App Service
        run: az webapp restart --resource-group "열매나눔재단" --name merryyear-chatbot-v4

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 \
              https://merryyear-chatbot-v4-hnd0b5fka2b8gghn.koreacentral-01.azurewebsites.net/api/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1
