name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$AZURE_WEBAPP_NAME"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_WEBAPP_URL"

      - name: Reject tracked runtime data
        run: node scripts/check-deployment-data.mjs

      - name: Run tests
        run: pnpm test

      - name: Assemble standalone deployment
        shell: bash
        run: |
          mkdir -p deploy/.next
          cp .next/standalone/server.js deploy/server.js
          cp -R .next/standalone/.next/. deploy/.next/
          mkdir runtime-deps
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml runtime-deps/
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --dir runtime-deps
          cp -R runtime-deps/node_modules deploy/node_modules
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          node -e "require('./deploy/node_modules/next/dist/server/next')"

      - name: Reject runtime data in deployment package
        run: node scripts/check-deployment-data.mjs deploy

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Restart Azure App Service
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 \
              "${AZURE_WEBAPP_URL%/}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
