name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$AZURE_WEBAPP_NAME"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_WEBAPP_URL"

      - name: Reject tracked runtime data
        run: node scripts/check-deployment-data.mjs

      - name: Run tests
        run: pnpm test

      - name: Assemble standalone deployment
        shell: bash
        run: |
          mkdir -p deploy/.next
          cp .next/standalone/server.js deploy/server.js
          cp -R .next/standalone/.next/. deploy/.next/
          mkdir runtime-deps
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml runtime-deps/
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --dir runtime-deps
          cp -R runtime-deps/node_modules deploy/node_modules
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          node -e "require('./deploy/node_modules/next/dist/server/next')"

      - name: Reject runtime data in deployment package
        run: node scripts/check-deployment-data.mjs deploy

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Configure Gemini model
        id: configure_gemini
        shell: bash
        run: |
          previous_model="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "[?name=='GEMINI_MODEL'].value | [0]" --output tsv --only-show-errors)"
          echo "previous_model=${previous_model:-gemini-3.8-flash}" >> "$GITHUB_OUTPUT"
          echo "Previous Gemini model: ${previous_model:-gemini-3.8-flash}"
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --settings "GEMINI_MODEL=$GEMINI_MODEL" --output none --only-show-errors

      - name: Restart Azure App Service
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

      - name: Verify deployed Gemini model
        shell: bash
        run: |
          configured_model="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "[?name=='GEMINI_MODEL'].value | [0]" --output tsv --only-show-errors)"
          test "$configured_model" = "$GEMINI_MODEL"
          echo "Verified Gemini model: $configured_model"

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 \
              "${AZURE_WEBAPP_URL%/}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify connected AI response
        id: verify_ai
        run: python3 scripts/verify-ai-deployment.py --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --url "$AZURE_WEBAPP_URL" --expected-model "$GEMINI_MODEL"

      - name: Restore previous Gemini model after failed AI check
        if: failure() && steps.verify_ai.conclusion == 'failure'
        env:
          PREVIOUS_GEMINI_MODEL: ${{ steps.configure_gemini.outputs.previous_model }}
        run: |
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --settings "GEMINI_MODEL=$PREVIOUS_GEMINI_MODEL" --output none --only-show-errors
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
